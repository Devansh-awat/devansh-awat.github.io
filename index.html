<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Artifact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .puzzle-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .wood-segment {
            position: absolute;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid rgba(236, 240, 241, 0.25);
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .wood-segment:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(52, 152, 219, 0.8);
        }

        .wood-segment.positioned {
            cursor: default;
            transform: none !important;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            border-color: rgba(236, 240, 241, 0.1);
        }

        .wood-segment.positioned:hover {
            transform: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            border-color: rgba(236, 240, 241, 0.1);
        }

        .grid-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 700px;
            height: 700px;
            pointer-events: none;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: linear-gradient(145deg, #34495e, #2c3e50);
            margin: 10% auto;
            padding: 35px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: modalSlideIn 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid rgba(52, 152, 219, 0.3);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-60px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .close {
            color: #bdc3c7;
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close:hover {
            color: #3498db;
        }

        .modal h2 {
            color: #ecf0f1;
            margin-bottom: 20px;
            font-size: 26px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .modal p {
            color: #bdc3c7;
            line-height: 1.7;
            font-size: 17px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .grid-container {
                width: 95vw;
                height: 95vw;
                gap: 5px;
            }
            
            .modal-content {
                width: 95%;
                margin: 5% auto;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="puzzle-container" id="puzzleContainer">
        <div class="grid-container"></div>
    </div>

    <div id="segmentModal" class="modal">
        <div class="modal-content">
            <span class="close">×</span>
            <h2 id="modalTitle">Segment Details</h2>
            <p id="modalText">Information will appear here.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // UPDATED: Image URLs now use relative paths.
            const segmentData = [
                { id: 0, title: "Segment 1", writeup: "This is the first segment.", imageUrl: "Untitled.png" },
                { id: 1, title: "Segment 2", writeup: "This is the second segment.", imageUrl: "Untitled 2.png" },
                { id: 2, title: "Segment 3", writeup: "This is the third segment.", imageUrl: "Untitled 3.png" },
                { id: 3, title: "Segment 4", writeup: "This is the fourth segment.", imageUrl: "Untitled 4.png" },
                { id: 4, title: "Segment 5", writeup: "This is the fifth segment.", imageUrl: "Untitled 5.png" },
                { id: 5, title: "Segment 6", writeup: "This is the sixth segment.", imageUrl: "Untitled 6.png" },
                { id: 6, title: "Segment 7", writeup: "This is the seventh segment.", imageUrl: "Untitled 7.png" },
                { id: 7, title: "Segment 8", writeup: "This is the eighth segment.", imageUrl: "Untitled 8.png" },
                { id: 8, title: "Segment 9", writeup: "This is the ninth segment.", imageUrl: "Untitled 9.png" }
            ];

            let positionedSegments = 0;
            const segmentPositions = new Array(9).fill(false);
            const modal = document.getElementById('segmentModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalText = document.getElementById('modalText');
            const closeBtn = document.querySelector('.close');

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function loadImage(segment) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.src = segment.imageUrl;
                    img.onload = () => {
                        segment.width = img.naturalWidth;
                        segment.height = img.naturalHeight;
                        resolve(segment);
                    };
                    img.onerror = () => reject(new Error(`Failed to load image: ${segment.imageUrl}. Make sure it's in the same directory as the HTML file.`));
                });
            }

            async function initializeArtifact() {
                try {
                    const loadedSegments = await Promise.all(segmentData.map(loadImage));
                    shuffle(loadedSegments);
                    
                    const container = document.getElementById('puzzleContainer');
                    const gridContainer = document.querySelector('.grid-container');
                    const containerRect = container.getBoundingClientRect();

                    loadedSegments.forEach((segment, index) => {
                        const segmentDiv = document.createElement('div');
                        segmentDiv.className = 'wood-segment';
                        segmentDiv.id = `segment-${segment.id}`;
                        segmentDiv.style.width = `${segment.width}px`;
                        segmentDiv.style.height = `${segment.height}px`;
                        segmentDiv.style.backgroundImage = `url("${segment.imageUrl}")`; // Added quotes for safety with spaces in filenames

                        const gridRect = gridContainer.getBoundingClientRect();
                        let validPosition = false, attempts = 0;
                        while (!validPosition && attempts < 50) {
                            const x = Math.random() * (containerRect.width - segment.width);
                            const y = Math.random() * (containerRect.height - segment.height);
                            const gridLeft = gridRect.left - containerRect.left, gridRight = gridRect.right - containerRect.left;
                            const gridTop = gridRect.top - containerRect.top, gridBottom = gridRect.bottom - containerRect.top;
                            
                            if (x + segment.width < gridLeft - 20 || x > gridRight + 20 || y + segment.height < gridTop - 20 || y > gridBottom + 20) {
                                segmentDiv.style.left = `${x}px`;
                                segmentDiv.style.top = `${y}px`;
                                validPosition = true;
                            }
                            attempts++;
                        }

                        if (!validPosition) {
                            segmentDiv.style.left = `${20 + (index * 25)}px`;
                            segmentDiv.style.top = `${20 + (index * 25)}px`;
                        }

                        segmentDiv.addEventListener('click', () => handleSegmentClick(segment));
                        container.appendChild(segmentDiv);
                    });
                } catch (error) {
                    console.error("Error initializing artifact:", error);
                    document.body.innerHTML = `<p style="color: red; padding: 20px; font-size: 18px; text-align: center;">${error.message}</p>`;
                }
            }

            function handleSegmentClick(segment) {
                modalTitle.textContent = segment.title;
                modalText.textContent = segment.writeup;
                modal.style.display = 'block';
                if (!segmentPositions[segment.id]) {
                    moveToGridPosition(segment);
                }
            }

            function moveToGridPosition(segment) {
                const segmentDiv = document.getElementById(`segment-${segment.id}`);
                if (!segmentDiv) return;

                const gridContainer = document.querySelector('.grid-container');
                const containerRect = document.getElementById('puzzleContainer').getBoundingClientRect();
                const gridRect = gridContainer.getBoundingClientRect();
                
                const row = Math.floor(segment.id / 3);
                const col = segment.id % 3;
                const cellWidth = gridRect.width / 3;
                const cellHeight = gridRect.height / 3;

                const targetX = (gridRect.left - containerRect.left) + (col * cellWidth) + (cellWidth - segment.width) / 2;
                const targetY = (gridRect.top - containerRect.top) + (row * cellHeight) + (cellHeight - segment.height) / 2;

                segmentDiv.style.left = `${targetX}px`;
                segmentDiv.style.top = `${targetY}px`;
                segmentDiv.classList.add('positioned');
                
                if (!segmentPositions[segment.id]) {
                    segmentPositions[segment.id] = true;
                    positionedSegments++;
                    if (positionedSegments === segmentData.length) {
                        console.log("Artifact assembly complete!");
                    }
                }
            }
            
            closeBtn.onclick = () => modal.style.display = 'none';
            window.onclick = (event) => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            }

            window.onresize = () => {
                segmentData.forEach(segment => {
                    if (segmentPositions[segment.id]) {
                        moveToGridPosition(segment);
                    }
                });
            };

            initializeArtifact();
        });
    </script>
</body>
</html>
